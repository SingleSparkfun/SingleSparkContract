[package]
name = "singlespark-solana"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[workspace]
members = ["tests/pump-fixture"]
default-members = ["."]

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
solana-program = "=2.3.0"
solana-curve25519 = "=2.3.13"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }

[features]
no-entrypoint = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
