[package]
name = "singlespark-timelock"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
path = "../../programs/timelock/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
solana-program = "=2.3.0"

[features]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
