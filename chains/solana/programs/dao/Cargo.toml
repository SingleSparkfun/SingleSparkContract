[package]
name = "singlespark-dao"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
path = "../../programs/dao/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
solana-program = "=2.3.0"
solana-curve25519 = "=2.3.13"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }

[features]
no-entrypoint = []
devnet-ten-minute-rounds = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
