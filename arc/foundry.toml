[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Keep the guarded factory below EIP-170 without splitting its accounting across contracts.
via_ir = true
bytecode_hash = "none"
remappings = [
  "launcher/=lib/liquidity-launcher/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "solady/=lib/solady/src/",
  "solmate/=lib/solmate/",
  "permit2/=lib/permit2/",
  "forge-std/=lib/forge-std/src/"
]

[lint]
lint_on_build = false
